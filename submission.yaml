submission:
  title: "DEFCON-X: AI Defence Readiness & Threat Intelligence Copilot"                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Defence organizations face two major challenges: equipment failures
    can be difficult to identify before a mission, while security teams
    receive large numbers of alerts and may struggle to identify which
    threats are genuine and urgent. They need unified visibility into mission readiness,
    threat intelligence, and mission impact.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    DEFCON-X unifies mission readiness and threat intelligence into one AI-powered
    command environment. Instead of managing separate dashboards, defence teams get
    one copilot that answers: Is this mission ready? What could go wrong? Why is it risky?
    What will happen next? What should we prioritize?

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Real-time Mission Readiness Assessment: Asset health monitoring + predictive maintenance"
    - "Threat Intelligence Correlation: Cyber threat detection + alert prioritization"
    - "AI Copilot: Risk explanations, threat summaries, recommended actions"
    - "Mission-Impact Mapping: Connects threats & failures to mission outcomes"
    - "Unified Command Environment: One dashboard for defence readiness"

  tech_stack:
    languages: ["TypeScript", "React"]                      # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: ["React 19.2", "TanStack Start", "TanStack Router", "Vite 8.1.5"]                     # e.g., ["FastAPI", "React"]
    ibm_technologies: ["watsonx.ai (planned integration)"]               # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: []                      # e.g., ["PostgreSQL", "Redis"]
    other: ["Radix UI", "shadcn/ui", "Tailwind CSS", "Recharts", "React Hook Form", "Zod", "Sonner", "Bun"]                          # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    The unified intelligence model that connects mission readiness and threat intelligence
    in one copilot interface — something currently handled by separate point solutions in defence organizations.
    Our architecture is designed for seamless integration with watsonx.ai for AI-powered
    anomaly detection, threat assessment, and actionable recommendations.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    AI copilot features are scaffolded and ready for LLM integration via watsonx.ai.
    Current implementation uses mock data for demonstration. Authentication layer and
    database integration are in progress. The application is a prototype built for the hackathon.

